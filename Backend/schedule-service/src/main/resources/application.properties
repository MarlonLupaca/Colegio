spring.application.name=schedule-service
server.port=8099

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Disable database auto-configurations for local development testing without running DBs

# Disable Eureka registration for testing individual microservices standalone
eureka.client.enabled=false

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clg_schedule-service
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA e Hibernate (Crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desactivar temporalmente Eureka y Kafka