server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/user/**

        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audit/**

        - id: recovery-service
          uri: lb://RECOVERY-SERVICE
          predicates:
            - Path=/api/recovery/**

        - id: course-service
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/api/v1/courses/**

        - id: section-service
          uri: lb://SECTION-SERVICE
          predicates:
            - Path=/api/v1/annual-sections/**

        - id: classroom-service-route
          uri: lb://SECTION-SERVICE
          predicates:
            - Path=/api/v1/classrooms/**

        - id: assigned-classes-service
          uri: lb://SECTION-SERVICE
          predicates:
            - Path=/api/v1/assigned-classes/**

        - id: billing-service
          uri: lb://BILLING-SERVICE
          predicates:
            - Path=/api/v1/billing/**

        - id: enrollment-service
          uri: lb://ENROLLMENT-SERVICE
          predicates:
            - Path=/api/enrollment/**

        - id: announcement-service
          uri: lb://ANNOUNCEMENT-SERVICE
          predicates:
            - Path=/api/v1/announcement/**

        - id: schedule-service
          uri: lb://SCHEDULE-SERVICE
          predicates:
            - Path=/api/v1/time-blocks/**

        - id: schedule-service
          uri: lb://SCHEDULE-SERVICE
          predicates:
            - Path=/api/v1/class-schedules/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notification/**

        - id: material-service
          uri: lb://MATERIAL-SERVICE
          predicates:
            - Path=/api/v1/materials/**

        - id: material-weeks-service
          uri: lb://MATERIAL-SERVICE
          predicates:
            - Path=/api/v1/weeks/**

# Configuración de Cliente Eureka
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging para depuración del ruteo reactivo
logging:
  level:
    org.springframework.cloud.gateway: INFO
