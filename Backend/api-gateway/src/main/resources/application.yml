server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: announcement-service
          uri: lb://announcement-service
          predicates:
            - Path=/api/announcement/**
        - id: assignment-service
          uri: lb://assignment-service
          predicates:
            - Path=/api/assignment/**
        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/api/attendance/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/billing/**
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/course/**
        - id: enrollment-service
          uri: lb://enrollment-service
          predicates:
            - Path=/api/enrollment/**
        - id: exam-service
          uri: lb://exam-service
          predicates:
            - Path=/api/exam/**
        - id: grading-service
          uri: lb://grading-service
          predicates:
            - Path=/api/grading/**
        - id: material-service
          uri: lb://material-service
          predicates:
            - Path=/api/material/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**
        - id: receipt-service
          uri: lb://receipt-service
          predicates:
            - Path=/api/receipt/**
        - id: recovery-service
          uri: lb://recovery-service
          predicates:
            - Path=/api/recovery/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/report/**
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/api/request/**
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/schedule/**
        - id: section-service
          uri: lb://section-service
          predicates:
            - Path=/api/section/**
        - id: storage-service
          uri: lb://storage-service
          predicates:
            - Path=/api/storage/**
        - id: student-record-service
          uri: lb://student-record-service
          predicates:
            - Path=/api/student-record/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**

# Eureka Client Configuration
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
