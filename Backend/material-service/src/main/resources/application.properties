spring.application.name=material-service
server.port=8093

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Disable database auto-configurations for local development testing without running DBs

# Disable Eureka registration for testing individual microservices standalone
eureka.client.enabled=false

